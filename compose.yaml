services:
  bot:
    build:
      context: .
      # На OpenWrt/FriendlyWrt bridge docker0 часто без veth — pip в RUN ломается.
      network: host
    container_name: unimi-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    # На шлюзе с VLESS/split-tunnel контейнер наследует маршруты хоста.
    network_mode: host
